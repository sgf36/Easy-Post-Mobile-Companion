name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: "Capture store screenshots without cutting a build"
        type: boolean
        default: false
      locales:
        description: "Languages to capture, comma-separated"
        type: string
        default: "en,de,es,fr,hi,ja,zh"
      play_track:
        description: "Play track for this build. Production is not offered here."
        type: choice
        default: internal
        options: [internal, alpha, beta]
      android_screenshots:
        description: "Capture Play store screenshots from an Android emulator"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  # Fast gate: static analysis + unit tests on every push/PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The ARB catalogues are the source of truth and the Dart in lib/l10n is
      # generated from them. Regenerating here means a hand-edited generated
      # file cannot mask a catalogue that no longer compiles.
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  # Splits the dispatch input into a JSON array for the screenshot matrix.
  #
  # This job exists because GitHub Actions expressions have no split() and no
  # replace(), so `fromJSON` cannot be handed a comma-separated string. The
  # desktop repo hit the same wall today and solved it the same way.
  locales:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - id: split
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          items = [s.strip() for s in os.environ["LOCALES"].split(",") if s.strip()]
          if not items:
              raise SystemExit("no locales given")
          print("matrix=" + json.dumps(items))
          PY

  # Android: a Play-ready signed .aab when the keystore secrets exist, otherwise
  # a debug .apk so the build is still exercised end to end.
  #
  # Skipped on a screenshots-only dispatch. Recapturing a listing is a release
  # chore that should not also mint a store build: every dispatch used to burn a
  # github.run_number on an upload nobody asked for.
  android:
    if: ${{ inputs.screenshots_only != true }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # secrets can't be used in `if:`, so detect them here and gate on the output.
      - id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure release signing
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # --build-number, not --build-name: the version name comes from pubspec.yaml
      # so there is one place it is written, while the code has to increase on
      # every upload, which a file in git cannot do. Without this every bundle
      # carried versionCode 1 and Play would reject the second one.
      - name: Build signed App Bundle
        if: steps.signing.outputs.ready == 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      # A signed release APK alongside the bundle. No longer offered anywhere:
      # the direct download it fed was retired once Play had a testing track,
      # because an APK install cannot update itself. Kept because `adb install`
      # of a release build is the only way to check a signed binary on a real
      # device without going through a track.
      - name: Build signed APK (direct download)
        if: steps.signing.outputs.ready == 'true'
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build debug APK (no signing secrets yet)
        if: steps.signing.outputs.ready != 'true'
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: warn
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk

      # Push the bundle to a Play testing track, so an Android build reaches a
      # phone the way an iOS one already reaches TestFlight. Until this existed
      # the only Android channel was a direct APK download, which is a snapshot
      # with no update path: whoever installed one was stranded on it.
      #
      # Never production. The track choice tops out at beta, here and in
      # tool/play_upload.py, so a release to the public stays a deliberate act
      # in the Console rather than a default on the job that also does routine
      # test uploads.
      #
      # Gated on the secret like the signing steps above, and skipped on pull
      # requests: a fork's PR must not be able to publish, and an internal
      # release per PR would burn a versionCode each time.
      - id: play
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      # The commit message reaches the script through the environment, never
      # through the command line. Interpolating it into `run:` would put
      # attacker-controlled text into a shell — a commit titled with a
      # backtick or a quote is enough — and would break on any newline.
      - name: Upload to Play (${{ inputs.play_track || 'internal' }})
        if: steps.play.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check PyJWT requests cryptography
          NOTES=$(printf '%s' "${COMMIT_MESSAGE:-}" | head -1)
          [ -n "$NOTES" ] || NOTES="Build $RUN_NUMBER"
          python3 tool/play_upload.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track "$PLAY_TRACK" --notes "$NOTES"

      - name: Play upload skipped
        if: steps.play.outputs.ready != 'true'
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — see PLAY-SETUP.md. The bundle is in the android artifact."

  # iOS: a signed App Store .ipa when the certificate/profile secrets exist,
  # otherwise a --no-codesign compile check so the build is validated on macOS.
  ios:
    if: ${{ inputs.screenshots_only != true }}
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - id: signing
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$P12_B64" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$APPLE_ID" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; else echo "upload=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import certificate & provisioning profile
        if: steps.signing.outputs.ready == 'true'
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Write ExportOptions.plist
        if: steps.signing.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.spencerfields.easypostmobilecompanion</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      # The flutter-create project uses automatic signing (needs an Apple account
      # in Xcode), which fails in CI. Force manual signing with the Distribution
      # cert + App Store profile for the archive.
      - name: Force manual code signing
        if: steps.signing.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"iPhone Developer"/"Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
          } >> ios/Flutter/Release.xcconfig

      # The version name comes from pubspec.yaml. It used to be hardcoded here as
      # 1.0.0 while pubspec said 1.2.0, so the file that looked authoritative was
      # not; both now read 1.0.0 and only one of them is written down.
      - name: Build signed IPA
        if: steps.signing.outputs.ready == 'true'
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }}

      # Upload to App Store Connect (TestFlight) when Apple ID creds are present
      # and this is a push to main (not a PR). Same altool path as the desktop
      # Mac App Store leg.
      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.upload == 'true' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $IPA to App Store Connect..."
          xcrun altool --upload-app -f "$IPA" -t ios -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"

      - name: Build (no signing secrets) — compile check
        if: steps.signing.outputs.ready != 'true'
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: warn
          path: build/ios/ipa/*.ipa

  # Play store screenshots, from an Android emulator on a Linux runner.
  #
  # The same integration test as the iOS leg drives it. The test knows nothing
  # about how a picture is taken — it calls the shot server at each settled
  # frame — so tool/shotserver.py switches between `xcrun simctl` and
  # `adb exec-out screencap` on SHOTS_PLATFORM, and one shot list serves both
  # stores.
  #
  # Manual dispatch only, like the iOS leg: capture is a release chore, not a
  # per-push cost.
  #
  # English only for now. Play takes localised imagery per listing language and
  # this listing has one; the matrix can grow when the other languages do.
  android-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.android_screenshots == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_SHOTS_DIR: ${{ github.workspace }}/play-screenshots
      SHOTS_PLATFORM: android
      AVD_NAME: play-capture
      PACKAGE: com.spencerfields.easypostmobilecompanion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n

      # The emulator needs KVM, which exists on Linux runners but is owned by
      # root until a udev rule opens it. Without it the emulator drops to
      # software rendering and takes long enough to look like a hang.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and boot the emulator
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          ADB="$ANDROID_HOME/platform-tools/adb"
          IMAGE="system-images;android-34;google_apis;x86_64"
          yes | "$SDK/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/sdkmanager" --install "$IMAGE" "platform-tools" >/dev/null
          echo no | "$SDK/avdmanager" create avd -n "$AVD_NAME" -k "$IMAGE" \
            --device "pixel_6" --force
          # 1080x2340 at 440dpi: an ordinary modern phone, portrait, and inside
          # Play's 320-3840px bounds without resizing anything afterwards.
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio \
            -no-boot-anim -gpu swiftshader_indirect -skin 1080x2340 &
          "$ADB" wait-for-device
          # wait-for-device returns as soon as adb can talk to it, which is long
          # before Android has finished starting. Poll the property set last.
          until [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            sleep 5
          done
          "$ADB" shell wm density 440
          # Animations left on make a "settled" frame a lie: the test pumps
          # until Flutter is idle, but a system transition can still be part-way
          # through and lands in the picture.
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" devices

      - name: Capture screenshots
        run: |
          set -uo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p "$ASC_SHOTS_DIR"
          python3 tool/shotserver.py &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8099/shot?name=_warmup" >/dev/null && break || sleep 1
          done
          rm -f "$ASC_SHOTS_DIR/_warmup.png"

          # Same watchdog as the iOS leg, for the same reason: the gap between
          # the build finishing and the app connecting back to the harness is
          # outside the test, so no timeout inside the test bounds it.
          capture_once() {
            flutter test integration_test/screenshots_test.dart \
              -d emulator-5554 --dart-define=SHOTS_REQUIRED=1 \
              --dart-define=DEMO_FIXTURES=true --dart-define=UI_LOCALE=en &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              waited=$((waited + 10))
              if [ "$waited" -ge 900 ]; then
                echo "::warning::no result after ${waited}s — killing this attempt"
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
            done
            wait "$pid"
          }

          for attempt in 1 2 3; do
            echo "::group::capture attempt $attempt"
            rm -f "$ASC_SHOTS_DIR"/*.png
            capture_once
            code=$?
            echo "::endgroup::"
            [ "$code" = 0 ] && exit 0
            echo "::warning::attempt $attempt failed (exit $code)"
            [ "$attempt" = 3 ] && break
            "$ADB" uninstall "$PACKAGE" || true
          done
          echo "::error::capture failed after 3 attempts"
          exit 1

      # The same proof the iOS leg demands. A capture path that answers 200
      # whatever happened has been green over an empty directory before.
      - name: Verify the captures
        run: |
          set -euo pipefail
          COUNT=$(ls -1 "$ASC_SHOTS_DIR"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "captured $COUNT png(s)"
          [ "$COUNT" -ge 7 ] || { echo "::error::expected at least 7 screenshots, got $COUNT"; exit 1; }
          python3 tool/verify_shots.py --min-edge 320 --max-edge 3840 --portrait "$ASC_SHOTS_DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-screenshots
          path: ${{ env.ASC_SHOTS_DIR }}

  # App Store screenshots, on a hosted macOS runner rather than a rented Mac.
  #
  # Manual dispatch only: capture is a release chore, not a per-push cost, and
  # booting a simulator plus a full integration run is slow.
  #
  # The split between the test and tool/shotserver.py is deliberate — the test
  # drives the widget tree in-process, so it needs no accessibility permissions,
  # and it cannot shell out from inside the simulator. It calls the host at each
  # settled frame; the host captures and answers only once the PNG is written,
  # which keeps the two in lockstep instead of sleeping and hoping.
  #
  # One leg per language. The App Store takes localised imagery for seven of the
  # listing's twenty-eight languages and falls back to the English set for the
  # rest, which is what both this listing and the Microsoft Store one already do.
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, locales]
    runs-on: macos-latest
    # A wedged capture used to sit until GitHub's six-hour default. It has cost
    # that twice: a run cancelled by hand after 6h1m, and three legs of the
    # 2026-08-21 recapture. Nothing here legitimately takes an hour.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.matrix) }}
    env:
      DEVICE: iPhone 16 Pro Max
      CAPTURE_TIMEOUT_SECONDS: "900"
      ASC_SHOTS_DIR: ${{ github.workspace }}/asc-screenshots/${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n

      # A fresh Xcode ships only the current generation's devices, but the
      # device TYPE is present in the runtime even when the device is not, so
      # the 6.9-inch Pro Max can be created on demand. App Store Connect
      # requires that size, and 1320x2868 is accepted without resizing.
      - name: Boot the 6.9-inch simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          if ! xcrun simctl list devices available | grep -q "$DEVICE"; then
            RUNTIME=$(xcrun simctl list runtimes --json \
              | python3 -c "import json,sys;r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and 'iOS' in x['name']];print(r[-1])")
            echo "Creating $DEVICE on $RUNTIME"
            xcrun simctl create "$DEVICE" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$RUNTIME"
          fi
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl list devices | grep "$DEVICE"

      # No `open -a Simulator`: a runner has no GUI session, and
      # `simctl io booted screenshot` does not need one.
      # `flutter test` can wedge in the gap between "Xcode build done" and the
      # app connecting back to the test harness. That gap is outside the test,
      # so neither the testWidgets Timeout nor pumpAndSettle's own cap applies,
      # and the leg sits doing nothing until the job is killed. The log of a
      # wedged run ends at "Xcode build done" with no further line at all,
      # while a healthy one reaches its first CAPTURED within ninety seconds.
      #
      # It is flaky, not locale-specific: on 2026-08-21 German wedged in one run
      # and passed in the next. So the answer is a watchdog and a retry, not a
      # fix to any one language. macOS ships no coreutils `timeout`, hence the
      # explicit poll; `set -e` is off so a failed attempt reaches the retry.
      - name: Capture screenshots
        run: |
          set -uo pipefail
          mkdir -p "$ASC_SHOTS_DIR"
          python3 tool/shotserver.py &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8099/shot?name=_warmup" >/dev/null && break || sleep 1
          done
          rm -f "$ASC_SHOTS_DIR/_warmup.png"

          capture_once() {
            flutter test integration_test/screenshots_test.dart \
              -d "$DEVICE" --dart-define=SHOTS_REQUIRED=1 --dart-define=DEMO_FIXTURES=true \
              --dart-define=UI_LOCALE=${{ matrix.locale }} &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              waited=$((waited + 10))
              if [ "$waited" -ge "$CAPTURE_TIMEOUT_SECONDS" ]; then
                echo "::warning::no result after ${waited}s — killing this attempt"
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
            done
            wait "$pid"
          }

          for attempt in 1 2 3; do
            echo "::group::capture attempt $attempt"
            # Half a set is worse than none: the verify step counts files, so a
            # killed attempt must not leave its partial output behind to be
            # topped up by the next one.
            rm -f "$ASC_SHOTS_DIR"/*.png
            capture_once
            code=$?
            echo "::endgroup::"
            [ "$code" = 0 ] && exit 0
            echo "::warning::attempt $attempt failed (exit $code)"
            [ "$attempt" = 3 ] && break
            # A killed attempt leaves the simulator holding a half-installed app.
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl erase "$DEVICE" || true
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
          done
          echo "::error::capture failed after 3 attempts"
          exit 1

      # The capture path has failed silently before: the server answered 200
      # whatever happened and the test caught its own errors, so a run that
      # captured nothing was green. Prove the files exist, and at the size the
      # App Store demands, before calling this a success.
      - name: Verify the captures
        run: |
          set -euo pipefail
          COUNT=$(ls -1 "$ASC_SHOTS_DIR"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "captured $COUNT png(s)"
          [ "$COUNT" -ge 7 ] || { echo "::error::expected at least 7 screenshots, got $COUNT"; exit 1; }
          python3 tool/verify_shots.py --exact 1320x2868 --exact 1290x2796 "$ASC_SHOTS_DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.locale }}
          path: ${{ env.ASC_SHOTS_DIR }}
